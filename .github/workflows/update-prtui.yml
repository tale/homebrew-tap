name: Update prtui

# The formula is generated from whatever prtui's newest release published, so
# the tap needs no credentials of its own: it reads a public release and writes
# to itself with the token every run already has.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    name: Regenerate the formula
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: "Iv23liki4UCydzX0wo2N"
          private-key: ${{ secrets.TALE_APP_PRIVATE_KEY }}

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Build the formula from the latest release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          tag=$(gh release view --repo tale/prtui --json tagName --jq .tagName)
          version=${tag#v}
          base="https://github.com/tale/prtui/releases/download/$tag"

          # A checksum that never arrived means a half-finished release; taking
          # it would pin the formula to a tarball nobody can verify.
          sha_for() {
            curl -fsSL "$base/prtui-$tag-$1.tar.gz.sha256" | cut -d' ' -f1
          }

          darwin_arm=$(sha_for aarch64-apple-darwin)
          darwin_intel=$(sha_for x86_64-apple-darwin)
          linux_arm=$(sha_for aarch64-unknown-linux-gnu)
          linux_intel=$(sha_for x86_64-unknown-linux-gnu)

          cat > Formula/prtui.rb <<RUBY
          # Generated by .github/workflows/update-prtui.yml. Edits are overwritten.
          class Prtui < Formula
            desc "Terminal UI for reviewing GitHub pull requests"
            homepage "https://github.com/tale/prtui"
            version "$version"
            license "MIT"

            depends_on "gh"

            # The repo is public now, so HEAD needs no key: plain HTTPS works
            # and a source build is the only thing that wants a toolchain.
            head do
              url "https://github.com/tale/prtui.git", branch: "main"
              depends_on "rust" => :build
            end

            on_macos do
              on_arm do
                url "$base/prtui-$tag-aarch64-apple-darwin.tar.gz"
                sha256 "$darwin_arm"
              end
              on_intel do
                url "$base/prtui-$tag-x86_64-apple-darwin.tar.gz"
                sha256 "$darwin_intel"
              end
            end

            on_linux do
              on_arm do
                url "$base/prtui-$tag-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$linux_arm"
              end
              on_intel do
                url "$base/prtui-$tag-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$linux_intel"
              end
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "prtui"
              end
            end

            test do
              assert_match "prtui #{version}", shell_output("#{bin}/prtui --version")
            end
          end
          RUBY

      - name: Commit when the formula moved
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula/prtui.rb; then
            echo "formula already matches the newest release"
            exit 0
          fi

          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/prtui.rb)

          # GitHub only attributes a commit to the app when the address carries
          # the bot account's own numeric id, which is not the app id.
          bot_id=$(gh api "/users/$SLUG[bot]" --jq .id)

          git config user.name "$SLUG[bot]"
          git config user.email "$bot_id+$SLUG[bot]@users.noreply.github.com"
          git commit -qam "prtui $version"
          git push
