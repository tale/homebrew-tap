name: Update united-bar

# The cask is generated from whatever united-bar's release workflow just
# signed, notarized and stapled. That job pushes the version and checksum
# here, so there is nothing to download or rebuild.
on:
  repository_dispatch:
    types: [united-bar]

permissions:
  contents: write

concurrency:
  group: united-bar
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate the cask
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.client_payload.version }}
      ARTIFACT: ${{ github.event.client_payload.artifact }}
      ARTIFACT_SHA256: ${{ github.event.client_payload.sha256 }}
    steps:
      - name: Mint a token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: "Iv23liki4UCydzX0wo2N"
          private-key: ${{ secrets.TALE_APP_PRIVATE_KEY }}

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Build the cask from the dispatch payload
        run: |
          set -euo pipefail

          test -n "$VERSION"
          test -n "$ARTIFACT"

          # A truncated checksum means the payload lost it in transit;
          # committing that would break every install until the next push.
          test "${#ARTIFACT_SHA256}" -eq 64
          case "$ARTIFACT_SHA256" in
            *[!0-9a-f]*) echo "bad sha256: $ARTIFACT_SHA256" >&2; exit 1 ;;
          esac

          mkdir -p Casks
          cat > Casks/united-bar.rb <<RUBY
          # Generated by .github/workflows/update-united-bar.yml. Edits are overwritten.
          cask "united-bar" do
            version "$VERSION"
            sha256 "$ARTIFACT_SHA256"

            # Rolling: \`tip\` is a moving tag republished on every push to main,
            # so the URL never changes. The version above exists only to make
            # \`brew upgrade\` notice that a new build landed.
            url "https://github.com/tale/united-bar/releases/download/tip/$ARTIFACT",
                verified: "github.com/tale/united-bar/"
            name "United Bar"
            desc "Menu bar app that tracks the United flight you are on"
            homepage "https://github.com/tale/united-bar"

            livecheck do
              skip "Rolling release; the upstream release workflow updates this cask"
            end

            depends_on macos: :sonoma
            depends_on arch: :arm64

            app "UnitedBar.app"

            uninstall quit: "me.tale.UnitedBar"

            zap trash: [
              "~/Library/Caches/me.tale.UnitedBar",
              "~/Library/HTTPStorages/me.tale.UnitedBar",
              "~/Library/Preferences/me.tale.UnitedBar.plist",
            ]

            caveats <<~EOS
              United Bar only reports while you are connected to United's
              in-flight wifi. On the ground the panel shows an error.
            EOS
          end
          RUBY

          cat Casks/united-bar.rb

      - name: Verify cask
        run: |
          set -euo pipefail
          ruby -c Casks/united-bar.rb
          url="$(ruby -e 'puts File.read("Casks/united-bar.rb")[%r{https://\S+\.zip}]')"
          curl -fsSLI -o /dev/null "$url"

      - name: Commit when the cask moved
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail

          git add Casks/united-bar.rb
          # Reruns of the same build are a no-op rather than a failure.
          if git diff --cached --quiet; then
            echo "cask already matches this build"
            exit 0
          fi

          # GitHub only attributes a commit to the app when the address carries
          # the bot account's own numeric id, which is not the app id.
          bot_id=$(gh api "/users/$SLUG[bot]" --jq .id)

          git config user.name "$SLUG[bot]"
          git config user.email "$bot_id+$SLUG[bot]@users.noreply.github.com"
          git commit -qm "united-bar $VERSION"
          git push
